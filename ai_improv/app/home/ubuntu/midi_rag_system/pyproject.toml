[tool.poetry]
name = "midi-rag-system"
version = "0.1.0"
description = "MIDI RAG 시스템: MCP, LangChain, FastAPI, YuE를 활용한 AI 즉흥 연주 프로그램"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
python-multipart = "^0.0.6"
langchain = ">=0.2.0,<0.3.0"
langchain-community = "^0.2.0"
langchain-core = ">=0.2.36,<0.3.0"
langchain-ollama = "^0.1.0"  
faiss-cpu = "^1.7.4"
mido = "^1.3.0"
music21 = "^9.1.0"
transformers = "^4.35.0"
torch = "^2.1.0"
accelerate = "^0.24.0"
bitsandbytes = "^0.41.1"
safetensors = "^0.4.0"
sentencepiece = "^0.1.99"
protobuf = "^4.24.4"
psutil = "^5.9.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.packages]
include = [
    { include = "midi_rag_system", from = "." },
]
