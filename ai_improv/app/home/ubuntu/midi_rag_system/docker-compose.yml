version: '3.8'

services:
  # API 서버 서비스
  api_server:
    build: .
    image: midi_rag_system
    container_name: midi_rag_api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    command: server
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - MCP_SERVER_HOST=mcp_server
      - MCP_SERVER_PORT=8000
    networks:
      - midi_rag_network
    depends_on:
      - mcp_server

  # MCP 서버 서비스
  mcp_server:
    build: .
    image: midi_rag_system
    container_name: midi_rag_mcp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: mcp
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
    networks:
      - midi_rag_network

networks:
  midi_rag_network:
    driver: bridge 